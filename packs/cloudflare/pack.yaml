# Cloudflare as a pack of kind source: the integration, imported into
# the yard and into no depot. What Cloudflare is here: the declared
# source cloudflare, which lists the account, its zones, its Workers
# scripts and its Email Routing rules and addresses as wrangler reads
# them, and uploads Workers, puts their secrets and makes or edits
# Email Routing rules as wrangler writes them, each write on its own
# card.
#
#   yardr pack apply cloudflare
#
# The source is named cloudflare: yardr knows Cloudflare as this pack
# alone.
name: cloudflare
api: 2
kind: source
setup: SETUP.md

sources:
  cloudflare:
    declaration: cloudflare.yaml

# Suggested grants: named sets of the source's calls, printed numbered
# by pack show. Suggesting grants nothing: the operator grants them,
# and terminal pack apply ignores them.
presets:
  read:
    about: List accounts, zones, Workers scripts and Email Routing rules and addresses; change nothing
    grants:
      cloudflare: [read]
  deploy:
    about: Read as read does, and upload Workers, put Worker secrets and make or edit Email Routing rules
    grants:
      cloudflare: [read, worker_upload, worker_secret, email_rule, email_rule_edit]
