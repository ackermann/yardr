# Starter pack for yardr: one yard's way of working, as one file.
# It names no agent product, model, rig, person or secret. Those are asked
# for when the pack is imported and stay in the yard.

name: starter

# Flows, by name. A rig uses one of them; the import asks which, and the first
# is the default. A flow with "type:" applies to beads of that type only, next
# to the rig's flow (an epic flow beside the task flow, say).
#
# Each flow lists the stages a bead passes through; the first is where a new
# bead starts.
#   group:   who works the stage (declared below)
#   file:    the stage file: what the stage is for, what must be true to leave
#            it and when each outcome applies, shown to whoever works a bead there
#   outcomes: outcome reported -> next stage
#   manual:  stages a person or a resident may move the bead to by hand
#   end:     the bead closes here
flows:
  default:
    stages:
      backlog:  { group: backlog,   file: flows/default/backlog.md,  manual: [new, decide] }
      new:      { group: builders,  file: flows/default/new.md,      outcomes: { done: review, question: decide }, manual: [backlog] }
      review:   { group: reviewers, file: flows/default/review.md,   outcomes: { done: approved, changes: new, question: decide } }
      approved: { group: refinery,  file: flows/default/approved.md, outcomes: { done: merged, failed: new, question: decide } }
      decide:   { group: decisions, file: flows/default/decide.md,   manual: [backlog, new] }
      merged:   { end: true }

# A group is exactly one of: an agent with a role, a script, or people.
# limit is how many beads it works at once.
groups:
  builders:  { agent: roles/builder.md,  limit: 5 }
  reviewers: { agent: roles/reviewer.md, limit: 3 }
  refinery:  { run: scripts/merge-local, limit: 1 }
  backlog:   { people: true }
  decisions: { people: true }

# Always-on sessions, by name. None is required; a yard may run without one,
# with several, or under another name (the import asks which resident of the
# yard takes each of these).
#
#   hears:      what it hears from the yard itself
#     events:   kinds of event (something went wrong, a bead was held, ...)
#     stages:   a bead enters one of these stages (must exist in a flow above)
#     done:     a bead closed
#   subscribe:  what it hears from outside sources, and how much:
#               involved (mentioned, assigned, or already in the thread),
#               mentions, or all
#   open_threads: the outside sources it should be able to open a thread in
#               of its own accord (linear, github). A pack only asks: the
#               import puts the question to the yard's operator, and only for
#               a source the yard is set up for
residents:
  mayor:
    role: roles/mayor.md
    hears:
      events: [gave_up, session_blocked, unrouted, stranded, no_runner, workspace_kept, resident_gave_up, runtime_down, session_idle, session_aged, session_stalled, session_harness_error, session_model_mismatch, session_prompt_gave_up, move_refused, held]
      stages: [decide]
      done: true
    subscribe:
      linear: involved
    open_threads: [linear]

# What an outside source hears of the flows above: when a bead that tracks
# one of its issues (yardr link) enters a stage, the issue goes to a status.
#
#   as:     the resident above the status is set as, with its credential
#   hears:  bead type -> stage -> started, review or done. A stage left out
#           changes nothing, and an issue is only ever moved forward
#
# The import sets this on the yard's hook of the source. It makes no hook,
# and it does not let the resident set a status: the operator grants that
# (set_state), and until then nothing is moved.
sources:
  linear:
    as: mayor
    hears:
      task: { new: started, review: review, merged: done }
