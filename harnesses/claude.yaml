# Claude Code. Every flag is from `claude --help`.
version: 1
label: Claude Code
provider: Anthropic
install: npm install -g @anthropic-ai/claude-code (https://claude.com/claude-code)

# On a Mac without a terminal (docs/doctor.md, "A program fetched on a Mac").
# Anthropic's own installer (https://claude.ai/install.sh) does this and no
# more: it downloads the binary of the version from downloads.claude.ai,
# checks it against the sha256 in that version's manifest.json, and runs it
# with `install <version>`, which puts the launcher at ~/.local/bin/claude,
# a link into ~/.local/share/claude/versions that Claude Code's own updates
# move. Read and run on 2026-10-13, on macOS 26.5.1 (arm64) in an empty
# home: it wrote no shell profile and changed none that was there, and says
# itself that ~/.local/bin is not on PATH. `install` needs the network: it
# fetches the version once more itself (with no network it fails, "connect
# ECONNREFUSED"), so what is checked here is the installer that is run, and
# what ends at ~/.local/bin/claude is Anthropic's own download of the same
# version. The sha256 below are that manifest's; the manifest is signed
# (manifest.json.sig, OpenPGP, key
# https://downloads.claude.ai/keys/claude-code.asc), and both binaries are
# signed by Developer ID Application: Anthropic PBC (Q6L2SF6YDW).
fetch:
  verified:
    from: https://code.claude.com/docs/en/setup
    on: 2026-10-13
  version: 2.1.296
  path: ~/.local/bin/claude
  run: [install, 2.1.296]
  targets:
    darwin/arm64:
      url: https://downloads.claude.ai/claude-code-releases/2.1.296/darwin-arm64/claude
      sha256: c9b5341637becbd423ddffc5b254afb645682a3868cb708bbc6cc0e7bb419937
      size: 240664432
    darwin/amd64:
      url: https://downloads.claude.ai/claude-code-releases/2.1.296/darwin-x64/claude
      sha256: a6bf4f30be241053a923f3820ad23c5991d2f5ac2935b3a8dd64da218d9cc603
      size: 249194752

# Claude Code asks whether a folder is trusted the first time it is started
# in it, and has no flag that skips the question: yardr answers it
# (internal/runner/trust.go). In its home the accept never sticks, so a crew
# member's start seeds that trust first (same file). The dialog is the start
# of its question, the
# answer the one that accepts it, the cursor the mark of its selected
# answer, as 2.1.288 prints them. The question's parenthetical tail wraps
# wherever the pane wraps, so the whole question never sits on one row;
# only its start marks the dialog at every width (yardr-q7rd).
trust:
  dialog: "Quick safety check:"
  answers: ["Yes, I trust this folder"]
  cursor: "❯"

# Claude Code begins a message it took with the mark of its input. Before a
# message of its own it draws ⏺ or ⎿; the other marks are a box's edge and
# what any TUI may draw before an error.
marks:
  input: "❯"
  message: "❯"
  error: "⏺⎿●■•▌│┃✗✘⚠!"

flags:
  model: --model
  unattended: [--permission-mode, auto]
  version: [--version]
  # Any executable can be called claude; this is what the real one says. Run
  # on 2 Nov 2026, Claude Code 2.1.310: `claude --version` printed
  #   2.1.310 (Claude Code)
  # A program that answers the flag with no "Claude Code" in it is another
  # program (docs/doctor.md, "A program that answers as another").
  version_contains: Claude Code
  one_shot: [-p]
  permissions:
    - label: auto
      args: [--permission-mode, auto]
      description: Claude judges each action; asks only about risky ones
    - label: accept edits
      args: [--permission-mode, acceptEdits]
      description: file edits allowed; shell commands still ask
    - label: bypass
      args: [--dangerously-skip-permissions]
      description: never asks; runs as you with full access
    # For an agent that reads what a stranger wrote: Claude Code's own
    # sandbox around every shell command, with the working directory denied
    # for writing too. Inside it nothing is written and nothing reaches the
    # network or a unix socket but the yard's, which every yardr command of
    # the session goes through: {socket} is its path, put in by the runner.
    # {workdir} is the directory the session works in, put in the same way:
    # the sandbox does not take "." for it, and a write there went through.
    # Run against 2.1.288.
    - label: read only
      args: [--settings, '{"sandbox":{"enabled":true,"filesystem":{"denyWrite":["{workdir}"]},"network":{"allowUnixSockets":["{socket}"]}}}']
      description: reads in a read-only sandbox, no network but the yard's socket; asks for anything else

# The models to pick from: the aliases `claude --help` names for --model
# ("an alias for the latest model (e.g. 'fable', 'opus', or 'sonnet') or a
# model's full name"), read with Claude Code 2.1.288 on 2026-10-15. An alias
# does not go stale when a version ships; each label is what it resolved to
# in recent session files on that date.
offers:
  - model: opus
    label: Opus 5.5
    recommended: yardmaster
  - model: fable
    label: Fable 5.1
  - model: sonnet
    label: Sonnet 5

# The model of the first assistant message, which is what the API answered
# with. Claude Code's own message (an API error shown as a reply) names
# "<synthetic>", which is no model: a name that begins with "<" is passed
# over for every kind.
model:
  home: .claude
  home_env: CLAUDE_CONFIG_DIR
  glob: projects/*/{session}.jsonl
  type: assistant
  field: message.model

# Context use is read from the session's own file, the one the model
# source above names: the last assistant line's message.usage, whose
# input, cache-read and cache-creation tokens add up to what the session
# holds. A kind with no context key has no context-based rotation: the 24h
# failsafe alone.
context:
  type: assistant
  usage: message.usage

# What a session used, in tokens, read from the same file once the session has
# ended (docs/design/2026-10-21-yardr-qbqq-session-tokens.md, section 3.3).
# The entries are tried in order, and the first that finds a line is the
# reading. Both were read on 22 Oct 2026 from the builder session of yardr-mnc8
# (session 4b176be6-9160-4463-9056-17f3f0c8a34f), a transcript of Claude Code
# 2.1.288. Claude Code counts its input apart from its cache in both entries,
# so neither names cache_in_input and the input read is also the fresh input.
usage:
  # The cost-state line Claude Code writes as the process exits: its own totals
  # for each model it called. That session's were Opus 752 input, 74,978
  # output, 23,562,912 cache read and 247,751 cache write, and Haiku 960 input
  # and 23 output for side calls that have no line of their own; the `*` adds
  # every model up. A session still running has none yet. It has no time of its
  # own, only the session's startTime, so a count that stops at a time cannot
  # use it.
  - type: cost-state
    usage: modelUsage.*
    input: inputTokens
    output: outputTokens
    cache_read: cacheReadInputTokens
    cache_write: cacheCreationInputTokens
  # The fallback for a session that never wrote one. Each assistant line
  # carries the usage of its whole message, and Claude Code writes one line for
  # each content block: that file's 223 lines are 121 messages, 159,912 output
  # tokens added up line by line and 74,962 once for each message.id. The
  # count stays short of cost-state's (246 input and 23,297,149 cache read
  # there) because the side calls have no line, so it is partial. The main file
  # alone is read; the subagents' files beside it are left out.
  - type: assistant
    usage: message.usage
    read: sum
    key: message.id
    partial: true
    at: timestamp
    input: input_tokens
    output: output_tokens
    cache_read: cache_read_input_tokens
    cache_write: cache_creation_input_tokens

# A line that says two things (an API error that ends in "Please run
# /login") is listed under the one that matters before the general one.
errors:
  - reason: not_logged_in
    pattern: '^(Not logged in|You are not logged in|Invalid API key|Please run /login)'
  - reason: not_logged_in
    pattern: '^(Your session has expired|Session expired)\. Please run /login'
  - reason: not_logged_in
    pattern: '^API Error.*(Please run /login|authentication_error)'
  - reason: rate_limited
    pattern: '^You.ve hit your '
  - reason: rate_limited
    pattern: '^(Claude usage|Usage|5-hour|Weekly|Session|Fable|Opus|Sonnet|Fast) limit reached'
  - reason: rate_limited
    pattern: '^API Error.*(\b429\b|rate_limit_error|Rate limit)'
  - reason: at_capacity
    pattern: '^Repeated 529 Overloaded errors'
  - reason: at_capacity
    pattern: '^API Error.*(\b529\b|overloaded_error|Overloaded)'
  - reason: other
    pattern: '^There''s an issue with the selected model'
  - reason: other
    pattern: '^Credit balance (is )?too low'
  - reason: other
    pattern: '^API Error'

# Claude Code's login screen, drawn in place of its input when it has no
# login (read live, Claude Code 2.1.288, 12 Oct 2026, with no credentials):
# a menu of login methods, then the browser sign-in with a code to paste.
# The menu's selected option carries the mark of the input, so without
# these lines the screen reads as text in the input. yardr types nothing
# there and tells of it as not logged in.
login:
  - pattern: '^Select login method:'
  - pattern: '^Paste code here if prompted'

# Claude Code's own login command, for a program that leads the login of a
# person with no terminal (yardr harness login claude --json; docs/doctor.md,
# "A harness's login led by a program"). Run on 13 Oct 2026 with Claude Code
# 2.1.288, with no credentials, in an empty home, on pipes with no terminal
# and with a stand-in for the browser's opener:
#   $ claude auth login
#   Opening browser to sign in…
#   If the browser didn't open, visit: https://claude.com/cai/oauth/authorize?code=true&...
#   Paste code here if prompted >
# It draws no menu: the method the login screen above asks for is a flag
# (`claude auth login --help`), and it asks nothing of a terminal. It opens
# the browser itself on a page that ends the login by itself (it answers to
# a port on localhost the command listens on); the address it prints is of
# the same sign-in, and ends on a page that shows a code, which the command
# reads as one line on stdin while it waits. A line that is no code ends it
# with `Login failed: Request failed with status code 400` and status 1.
# What it prints when a login is made was not run: no builder logs in.
# With --console the page it opens is on platform.claude.com. --sso and
# --email were not run and are no method here.
login_recipe:
  verified:
    from: claude auth login, Claude Code 2.1.288
    on: 2026-10-13
  argv: [auth, login]
  methods:
    - label: Claude subscription
      args: [--claudeai]
    - label: Anthropic Console (API usage billing)
      args: [--console]
  open_url: '^If the browser didn.t open, visit: (https://\S+)$'
  input: '^Paste code here if prompted'

# The variables of an API key Claude Code runs with when they are set in
# its session's environment (yardr-q9t9): the kind names them, not yardr's
# code. With them the yard's first-login ask offers an "API key" choice,
# which writes the given key into the crew member's environment and leads
# no login program.
login_env: [ANTHROPIC_API_KEY]

# The dialog Claude Code draws on its first start with such a key set and
# no login, which the yard answers Yes, as it answers folder trust (read
# live, Claude Code 2.1.288, 20 Oct 2026, with a stand-in key in a fresh
# home; one-shot never draws it). The key is only ever in the session's
# environment by the operator's hand.
#   Detected a custom API key in your environment
#   ANTHROPIC_API_KEY: sk-ant-...<last 20 of the key>
#   Do you want to use this API key?
#   Yes
#   ❯ No (recommended)
api_key:
  dialog: "Do you want to use this API key?"
  answers: ["Yes"]
  cursor: "❯"

# The onboarding screens Claude Code draws on its first start in a fresh
# home, before any login and before any input, which the yard answers in
# turn as it answers folder trust (read live under a pty, Claude Code
# 2.1.288, 21 Oct 2026, fresh HOME; with a stand-in ANTHROPIC_API_KEY set
# for the second). With a key the order is the theme picker, the API-key
# dialog above, the security notes, then folder trust; with no key the
# theme picker is followed by the login menu, with no security notes
# before it. Each entry is answered once, under its own mark, wherever
# and whenever it shows: at the start and on later passes.
#   Choose the text style that looks best with your terminal
#   To change this later, run /theme
#
#       Auto (match terminal)
#   ❯ ✔ Dark mode
#       Light mode
#       Dark mode (colorblind-friendly)
#       Light mode (colorblind-friendly)
#       Dark mode (ANSI colors only)
#       Light mode (ANSI colors only)
# The dialog opens with its cursor on Dark mode, and Enter takes it; the
# ✔ marks the current theme, stays where it is when the cursor moves, and
# is part of the answer's line. The question is 60 columns wide, so at a
# narrow pane it wraps; only its start marks the dialog at every width
# (yardr-q7rd).
#   Security notes:
#
#   1. Claude can make mistakes.
#      You're responsible for Claude's actions and should always
#      review them, especially when running code.
#
#   2. Due to prompt injection risks, only use it with code you trust
#      Learn more: https://code.claude.com/docs/en/security
#
#   Press Enter to continue…
# The security notes draw with no choice to move to: the entry names no
# cursor, and yardr answers it with Enter alone when both lines show.
#
# The third entry is no onboarding screen, but it stops a start the same way
# and is answered the same way: Claude Code's offer of its fullscreen
# renderer, the first of the dialogs it draws in place of its input once its
# onboarding is done (read live under herdr, Claude Code 2.1.310, 26 Oct
# 2026, in a home whose onboarding was done, with a stand-in ANTHROPIC_API_KEY;
# CLAUDE_CODE_FORCE_FULLSCREEN_UPSELL=1 draws it in a home that would not).
# herdr says the agent is blocked while it shows, and `dialogs` below is read
# only when yardr has text to type, so only an entry here answers it at a
# start.
#   Try the new fullscreen renderer?
#
#   · Flicker-free output — fixes the flashing you see during long responses
#   · Mouse support — click to move your cursor or expand results
#   · Selected text auto-copies to your clipboard
#
#   ❯ 1. Yes, try it
#     2. Not now
#
#   Enter to confirm · Esc to cancel
# The offer opens with its cursor on Yes. yardr moves it onto Not now before
# it sends Enter, so the session keeps the renderer yardr reads today. Not
# now takes Esc's way out: it writes nothing to the operator's
# settings, and it counts the offer as seen for good
# (fullscreenUpsellSeenCount in ~/.claude.json reaches 3, where the offer is
# no longer made). Claude Code's code skips the offer for a `tui` setting in
# settings.json and for CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN=1 in the
# environment (read in 2.1.310, not run), and neither is used: the first
# writes the operator's own file, and the second forces the classic renderer
# on an operator who chose fullscreen.
onboarding:
  - dialog: "Choose the text style"
    answers: ["✔ Dark mode"]
    cursor: "❯"
  - dialog: "Security notes:"
    answers: ["Press Enter to continue…"]
    cursor: ""
  - dialog: "Try the new fullscreen renderer?"
    answers: ["2. Not now"]
    cursor: "❯"

# Claude Code's offer to run /auto-mode-setup, drawn in place of its input
# at the end of a turn once auto mode has blocked several actions and
# ~/.claude/settings.json has no autoMode.environment (seen in a builder's
# pane, 12 Oct 2026, Claude Code 2.1.288). Its selected answer carries the
# mark of the input, and its answers are chosen by their digits. The runner
# sends Esc to cancel it without changing the operator's settings.
dialogs:
  - dialog: auto_mode_setup
    pattern: '^Teach auto mode about your environment\?'

# What Claude Code draws while a command its agent started in the background
# still runs (seen in two builders' panes, 13 Oct 2026, Claude Code 2.1.288):
# the line that ends the turn, above the input, and the status line under it.
#   ✻ Brewed for 48s · done 12:44 AM · 1 shell still running
#   ⏵⏵ auto mode on · 1 shell · ← 1 agent · ↓ to manage
# Claude Code wakes the agent when the shell exits, so the agent is not idle
# to the group's idle limit while either shows.
background:
  - pattern: ' · \d+ shells? still running$'
  - pattern: '(^| · )\d+ shells?( · |$)'
